---
version: '3'
vars:
  BUILD_DIR: build
  PRESET: clang-debug
tasks:
  cmake:
    internal: true
    cmds:
      - |
        cmake --preset {{.PRESET}} .
      - |
        cmake --build {{.BUILD_DIR}} --target {{.TARGET}}
  build:
    aliases:
      - default
    cmds:
      - task: cmake
        vars:
          TARGET: all
  build:renderer:
    aliases:
      - renderer
    cmds:
      - task: cmake
        vars:
          TARGET: renderer
  build:renderer-tests:
    aliases:
      - renderer-tests
    cmds:
      - task: cmake
        vars:
          TARGET: kura-renderer-tests

  ouch:
    internal: true
    cmds:
      - |
        ouch compress \
          .git/ \
          .github/ \
          .styles/ \
          Sources/ \
          assets/ \
          cmake/ \
          docs/ \
          wiki/ \
          examples/ \
          tests/ \
          .clang-format \
          .clang-tidy \
          .clangd \
          .editorconfig \
          .gitattributes \
          .gitignore \
          .release-please-manifest.json \
          .rumdl.toml \
          .vale.ini \
          .valeignore \
          .yamlfmt \
          .yamllint \
          CMakeLists.txt \
          CMakePresets.json \
          LICENSE \
          README.md \
          Taskfile.yml \
          lefthook.yml \
          release-please-config.json \
          vcpkg.json \
          kura-sources.{{.OUCH_COMPRESSION}}
  zip:
    cmds:
      - task: ouch
        vars:
          OUCH_COMPRESSION: zip
