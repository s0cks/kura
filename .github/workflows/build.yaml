name: Build Kura
on:
  push:
    branches: [main]
jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install llvm
        run: |
          sudo apt-get update
          bash -c "$(wget -O - https://apt.llvm.org/llvm.sh)" -- 22
      - name: Configure CMake
        run: |
          cmake --preset=clang-debug .
      - name: Build kura
        run: cmake --build build
